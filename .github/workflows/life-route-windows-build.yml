name: Life Route Windows Build

on:
  push:
    branches:
      - life-route-windows-build
    paths:
      - ".github/workflows/life-route-windows-build.yml"
      - "life-route-build/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: life-route-build/src/requirements.txt

      - name: Restore source package
        shell: powershell
        run: |
          $parts = Get-ChildItem "life-route-build\payload.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 payload parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("life-route-build\source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "life-route-build\source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "79e83572b7674023c53c534ace65f3d09b9de4bddc61335687076e1b76ff040a") {
            throw "Source package checksum mismatch: $hash"
          }
          Expand-Archive "life-route-build\source.zip" "life-route-build\src" -Force

      - name: Install dependencies
        shell: powershell
        working-directory: life-route-build/src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PDF export smoke test
        shell: powershell
        working-directory: life-route-build/src
        run: python tests/smoke_test.py

      - name: Build Windows executable
        shell: powershell
        working-directory: life-route-build/src
        run: pyinstaller --noconfirm --clean LifeRouteEditor.spec

      - name: Verify executable
        shell: powershell
        working-directory: life-route-build/src
        run: |
          $exe = "dist\Маршрут жизни.exe"
          if (!(Test-Path $exe)) { throw "Windows executable was not created" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "Executable is unexpectedly small: $size bytes" }
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LifeRouteEditor-Windows
          path: "life-route-build/src/dist/Маршрут жизни.exe"
          if-no-files-found: error
          retention-days: 7
